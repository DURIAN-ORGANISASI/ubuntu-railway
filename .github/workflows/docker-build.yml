name: Docker build and runtime validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke-test:
    name: Build and test (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    env:
      TERMINAL_USER: railway-ci-test
      TERMINAL_PASSWORD: ci-only-smoke-test-Password-2026
      IMAGE_TAG: railway-terminal-ci:${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build the Railway terminal image
        run: docker buildx build --pull --platform "${{ matrix.platform }}" --load --tag "$IMAGE_TAG" .

      - name: Start the container and verify the web terminal
        shell: bash
        run: |
          set -Eeuo pipefail
          container_name="railway-terminal-smoke"
          cleanup() { docker rm -f "$container_name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          docker run --detach \
            --name "$container_name" \
            --publish 127.0.0.1::8080 \
            --env TERMINAL_USER \
            --env TERMINAL_PASSWORD \
            --env PORT=8080 \
            "$IMAGE_TAG" >/dev/null

          host_port="$(docker port "$container_name" 8080/tcp | sed 's/.*://')"
          ready=0
          for attempt in $(seq 1 60); do
            if curl --silent --fail --user "${TERMINAL_USER}:${TERMINAL_PASSWORD}" \
              "http://127.0.0.1:${host_port}/" -o /tmp/ttyd-smoke.html 2>/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done

          if [[ "$ready" != "1" ]] || [[ ! -s /tmp/ttyd-smoke.html ]] || ! grep -qi "ttyd" /tmp/ttyd-smoke.html; then
            echo "ERROR: terminal HTTP smoke test failed."
            docker logs "$container_name" 2>&1 || true
            exit 1
          fi

          process_uid="$(docker exec "$container_name" awk '/^Uid:/ {print $2}' /proc/1/status)"
          if [[ "$process_uid" != "10001" ]]; then
            echo "ERROR: ttyd is running with UID $process_uid instead of non-root UID 10001."
            exit 1
          fi

          docker exec --user 10001:10001 "$container_name" sh -ec 'touch /data/.non-root-write-test && rm /data/.non-root-write-test'

          logs="$(docker logs "$container_name" 2>&1 || true)"
          credential_b64="$(printf '%s' "${TERMINAL_USER}:${TERMINAL_PASSWORD}" | base64 -w0)"
          if grep -Fq "$TERMINAL_PASSWORD" <<<"$logs" || grep -Fq "$credential_b64" <<<"$logs"; then
            echo "ERROR: terminal logs appear to contain a credential or its Base64 encoding."
            exit 1
          fi

          echo "PASS: ${{ matrix.platform }} image starts; ttyd authenticates, runs as UID 10001, /data is writable, and logs omit test credentials."

      - name: Scan image for HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_TAG }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
