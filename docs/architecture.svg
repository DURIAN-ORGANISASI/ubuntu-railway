<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">Arsitektur Ubuntu Personal Railway</title><desc id="desc">Diagram browser ke domain Railway, autentikasi ttyd, terminal Ubuntu, dan Railway Volume pada direktori data.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17100D"/><stop offset="1" stop-color="#101D2C"/></linearGradient><linearGradient id="orange" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#E95420"/><stop offset="1" stop-color="#FF9A55"/></linearGradient></defs>
<rect width="1200" height="500" rx="24" fill="url(#bg)"/>
<text x="48" y="52" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">Arsitektur layanan</text><text x="48" y="80" fill="#C5A69B" font-family="Inter,Arial,sans-serif" font-size="15">Terminal web dengan autentikasi dan penyimpanan opsional</text>
<g font-family="Inter,Arial,sans-serif">
<rect x="42" y="140" width="208" height="118" rx="17" fill="#222D40" stroke="#7F90A7" stroke-width="2"/><text x="146" y="185" fill="#FFFFFF" font-size="22" font-weight="700" text-anchor="middle">Browser</text><text x="146" y="215" fill="#B3C6DD" font-size="16" text-anchor="middle">HTTPS</text>
<path d="M250 199H286" stroke="url(#orange)" stroke-width="4" stroke-linecap="round"/><path d="M276 189L286 199L276 209" fill="none" stroke="#FF9A55" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="288" y="140" width="205" height="118" rx="17" fill="#312219" stroke="#E95420" stroke-width="2"/><text x="390" y="185" fill="#FFFFFF" font-size="22" font-weight="700" text-anchor="middle">Railway</text><text x="390" y="215" fill="#FFB38E" font-size="16" text-anchor="middle">Public domain</text>
<path d="M493 199H529" stroke="url(#orange)" stroke-width="4" stroke-linecap="round"/><path d="M519 189L529 199L519 209" fill="none" stroke="#FF9A55" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="531" y="140" width="238" height="118" rx="17" fill="#222D40" stroke="#7F90A7" stroke-width="2"/><text x="650" y="181" fill="#FFFFFF" font-size="21" font-weight="700" text-anchor="middle">ttyd</text><text x="650" y="209" fill="#B3C6DD" font-size="15" text-anchor="middle">Username + password</text><text x="650" y="233" fill="#B3C6DD" font-size="15" text-anchor="middle">Origin check</text>
<path d="M769 199H805" stroke="url(#orange)" stroke-width="4" stroke-linecap="round"/><path d="M795 189L805 199L795 209" fill="none" stroke="#FF9A55" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="807" y="140" width="351" height="118" rx="17" fill="#312219" stroke="#E95420" stroke-width="2"/><text x="982" y="181" fill="#FFFFFF" font-size="21" font-weight="700" text-anchor="middle">Ubuntu 26.04</text><text x="982" y="209" fill="#FFB38E" font-size="16" text-anchor="middle">Bash login shell + CLI tools</text><text x="982" y="233" fill="#FFB38E" font-size="15" text-anchor="middle">Working directory: /data</text>
<path d="M982 258V315" stroke="#E95420" stroke-width="3" stroke-linecap="round"/><path d="M972 305L982 315L992 305" fill="none" stroke="#FF9A55" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="807" y="318" width="351" height="93" rx="17" fill="#1D332E" stroke="#3DC19B" stroke-width="2"/><text x="982" y="356" fill="#FFFFFF" font-size="21" font-weight="700" text-anchor="middle">Railway Volume (optional)</text><text x="982" y="384" fill="#A9EAD6" font-size="16" text-anchor="middle">Mount path: /data</text>
<text x="48" y="356" fill="#F5D3C5" font-size="17" font-weight="700">Perlu diingat</text><text x="48" y="388" fill="#D5C3BC" font-size="15">Hanya data di path Volume</text><text x="48" y="412" fill="#D5C3BC" font-size="15">yang dipasang yang persisten.</text>
<text x="48" y="460" fill="#8FA3BD" font-size="14">Shell berjalan sebagai root di dalam container, bukan sebagai root host Railway.</text>
</g></svg>