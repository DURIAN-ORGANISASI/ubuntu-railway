<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Ubuntu Personal Railway</title>
  <desc id="desc">Original illustration showing the Ubuntu web terminal, system information, and persistent storage on Railway.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#160D0A"/><stop offset=".55" stop-color="#27130E"/><stop offset="1" stop-color="#0C1728"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E95420"/><stop offset="1" stop-color="#FF9A55"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#202C40"/><stop offset="1" stop-color="#111A2A"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>
  <rect width="1200" height="630" rx="28" fill="url(#bg)"/><circle cx="210" cy="170" r="180" fill="#E95420" opacity=".16" filter="url(#glow)"/><circle cx="1000" cy="520" r="180" fill="#F16B36" opacity=".12" filter="url(#glow)"/>
  <g transform="translate(76 66)">
    <rect width="1048" height="498" rx="26" fill="#0C1421" stroke="#5F352B" stroke-width="2"/>
    <path d="M26 0H1022A26 26 0 0 1 1048 26V64H0V26A26 26 0 0 1 26 0Z" fill="#312019"/>
    <circle cx="29" cy="32" r="7" fill="#FF655D"/><circle cx="53" cy="32" r="7" fill="#FFC857"/><circle cx="77" cy="32" r="7" fill="#51D88A"/>
    <text x="524" y="38" fill="#E7C7BC" font-family="Inter,Arial,sans-serif" font-size="16" text-anchor="middle" letter-spacing="2">UBUNTU PERSONAL RAILWAY</text>
    <g transform="translate(34 95)">
      <rect width="610" height="350" rx="17" fill="url(#card)" stroke="#3A4B62" stroke-width="2"/>
      <text x="28" y="43" fill="#F5F7FB" font-family="ui-monospace,Consolas,monospace" font-size="19">$ cat /etc/os-release</text>
      <text x="28" y="82" fill="#FF956B" font-family="ui-monospace,Consolas,monospace" font-size="17">PRETTY_NAME="Ubuntu 26.04 LTS"</text>
      <text x="28" y="119" fill="#87E5B1" font-family="ui-monospace,Consolas,monospace" font-size="16">● Terminal authentication active</text>
      <path d="M28 145H580" stroke="#37475D"/>
      <text x="28" y="184" fill="#AFC5E0" font-family="ui-monospace,Consolas,monospace" font-size="16">$ python3 --version</text>
      <text x="28" y="213" fill="#E7EDF6" font-family="ui-monospace,Consolas,monospace" font-size="16">Python 3.x</text>
      <text x="28" y="257" fill="#AFC5E0" font-family="ui-monospace,Consolas,monospace" font-size="16">$ df -h /data</text>
      <text x="28" y="286" fill="#E7EDF6" font-family="ui-monospace,Consolas,monospace" font-size="16">Working directory ready</text>
      <rect x="28" y="310" width="11" height="20" rx="2" fill="#F16A32"/>
    </g>
    <g transform="translate(680 105)" font-family="Inter,Arial,sans-serif">
      <circle cx="86" cy="74" r="55" fill="#E95420"/><circle cx="86" cy="74" r="27" fill="none" stroke="#FFFFFF" stroke-width="7"/>
      <circle cx="86" cy="39" r="10" fill="#FFFFFF"/><circle cx="56" cy="91" r="10" fill="#FFFFFF"/><circle cx="116" cy="91" r="10" fill="#FFFFFF"/>
      <text x="86" y="160" fill="#FFFFFF" font-size="23" font-weight="700" text-anchor="middle">Ubuntu 26.04</text>
      <text x="86" y="187" fill="#C9B9B3" font-size="15" text-anchor="middle">Browser terminal</text>
      <rect x="0" y="230" width="333" height="91" rx="16" fill="#1A2B40" stroke="#526781" stroke-width="2"/>
      <path d="M28 253H61V279H28Z M23 260H66 M33 270H56" fill="none" stroke="#FF9365" stroke-width="3" stroke-linejoin="round"/>
      <text x="83" y="263" fill="#FFFFFF" font-size="20" font-weight="700">Railway Volume</text><text x="83" y="290" fill="#B4C9E2" font-size="15">/data · optional persistence</text>
      <rect x="0" y="341" width="333" height="45" rx="11" fill="#3B2119" stroke="#A84A27"/><text x="166" y="369" fill="#FFB18F" font-size="15" font-weight="600" text-anchor="middle">Docker · ttyd · Bash</text>
    </g>
    <text x="524" y="475" fill="#9CACBF" font-family="Inter,Arial,sans-serif" font-size="14" text-anchor="middle" letter-spacing="2">AUTHENTICATED ACCESS · PORT 8080 FALLBACK</text>
  </g>
</svg>